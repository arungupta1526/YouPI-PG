name: ReviewGround AI Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  actions: read

jobs:
  review:
    name: ReviewGround Code Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || (github.event_name == 'issue_comment' && github.event.issue.pull_request && (contains(github.event.comment.body, '@reviewground') || contains(github.event.comment.body, '@review')))

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run ReviewGround
        uses: arungupta1526/reviewground@main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          mode: 'all'
          gemini-api-key: ${{ secrets.GEMINI_API_KEY }}
          groq-api-key: ${{ secrets.GROQ_API_KEY }}
          enable-search-grounding: 'true'
          enable-inline-suggestions: 'true'
          enable-npm-verify: 'true'
          enable-smart-diff-priority: 'true'
          enable-owasp-tagging: 'true'
          review-level: 'standard'
